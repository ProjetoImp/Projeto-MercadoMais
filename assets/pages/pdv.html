<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado+ | PDV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/pdv.css">
</head>
<body class="bg-[#cfe4df] text-slate-800 min-h-screen font-['Plus_Jakarta_Sans']">

    <!-- HEADER COM CARRINHO DE COMPRAS -->
    <header class="main-header sticky top-0 z-50 shadow-md">
    <div class="container mx-auto max-w-7xl px-6 py-4 flex justify-between items-center">
        <a href="../../index.html" class="logo-area flex items-center gap-3 text-white no-underline">
            <div class="logo-icon w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm text-xl">
                🛒
            </div>
            <img src="../imgs/logo-claro.png" alt="Logo Mercado+" class="h-14 w-auto">
        </a>
        
        <div class="flex items-center gap-6">
            <button id="btn-flutuante-carrinho" onclick="mudarTela('carrinho')" class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-xl transition-all relative flex items-center gap-2 border border-white/10">
                <span>🛒 Carrinho</span>
                <span id="badge-contador-carrinho" class="bg-red-500 text-white font-mono text-xs font-bold px-2 py-0.5 rounded-full shadow-md">
                    0
                </span>
            </button>

            <a href="../../index.html" class="back-link flex items-center gap-2 text-white font-medium hover:opacity-80 transition-opacity">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Sair do PDV
            </a>
        </div>
    </div>
</header>

    <main class="container mx-auto max-w-7xl px-6 py-8">
        
        <!-- VITRINE DE PRODUTOS -->
        <section id="secao-vitrine" class="space-y-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div class="search-box flex-1 w-full">
                    <input type="text" id="search-input" placeholder="Buscar produto por nome..." class="w-full px-4 py-2.5 border border-slate-200 rounded-xl outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 transition-all">
                </div>
                <div class="w-full md:w-64">
                    <select id="filter-categoria" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl outline-none bg-white focus:border-teal-600 transition-all">
                        <option value="">Todas as Categorias</option>
                    </select>
                </div>
            </div>

            <div id="grid-produtos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                </div>
        </section>

        <!-- CARRINHO DE COMPRAS -->
        <section id="secao-carrinho" class="hidden max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="md:col-span-2 bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-bold text-[#0b0b55] mb-4 flex items-center gap-2">
                        <span>🛒</span> Itens no Carrinho
                    </h2>
                    <div id="lista-carrinho" class="divide-y divide-slate-100 max-h-[400px] overflow-y-auto pr-2">
                        </div>
                </div>
                
                <div class="flex justify-between items-center pt-4 mt-4 border-t border-slate-100">
                    <button onclick="mudarTela('vitrine')" class="px-5 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 font-medium text-slate-600 transition-colors">
                        ← Continuar Comprando
                    </button>
                </div>
            </div>

            <!-- RESUMO DE COMPRAS -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col justify-between space-y-6">
                <div>
                    <h3 class="text-lg font-bold text-slate-700 mb-4">Resumo da Compra</h3>
                    
                    <div class="space-y-2 mb-6">
                        <label class="block text-sm font-semibold text-slate-600">Identificar-se (opcional)</label>
                        <div class="flex gap-2">
                            <input type="text" id="cpf-cliente" placeholder="000.000.000-00" class="w-full px-3 py-2 border border-slate-200 rounded-xl outline-none focus:border-teal-600 text-sm">
                            <button onclick="buscarCliente()" class="px-3 py-2 bg-slate-800 text-white rounded-xl text-sm font-medium hover:bg-slate-900 transition-colors">Buscar</button>
                        </div>
                        <p id="msg-cliente" class="text-xs font-medium text-slate-500 mt-1"></p>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-2">
                        <div class="flex justify-between text-sm text-slate-500">
                            <span>Itens adicionados:</span>
                            <span id="total-itens-carrinho" class="font-mono">0</span>
                        </div>
                        <div class="flex justify-between items-baseline pt-2 border-t border-slate-200/60">
                            <span class="text-base font-bold text-slate-700">Total:</span>
                            <span id="valor-total-carrinho" class="text-2xl font-black text-[#1e3a8a]">R$ 0,00</span>
                        </div>
                    </div>
                </div>

                <button onclick="finalizarCompra()" id="btn-finalizar" class="w-full py-3 bg-[#1e3a8a] text-white rounded-xl font-bold text-center hover:bg-[#1e40af] shadow-md shadow-blue-900/10 transition-all">
                    Finalizar Compra 🚀
                </button>
            </div>
        </section>

        <!-- EXTRATO/NOTINHA DE COMPRAS -->
        <section id="secao-notinha" class="hidden max-w-md mx-auto space-y-6">
            <div class="cupom-fiscal bg-white p-6 rounded-sm shadow-md border border-slate-200 relative">
                <div class="text-center space-y-1 pb-4 border-b border-dashed border-slate-300">
                    <h2 class="text-lg font-black tracking-wider text-slate-800">*** MERCADO+ ***</h2>
                    <p class="text-xs text-slate-500 font-mono">EXTRATO DE COMPRAS</p>
                    <p id="notinha-data" class="text-xs text-slate-400 font-mono">00/00/0000 00:00:00</p>
                </div>

                <div class="py-3 border-b border-dashed border-slate-300 text-xs font-mono space-y-1 text-slate-600">
                    <p>CLIENTE: <span id="notinha-cliente">Compra Anônima</span></p>
                    <p id="notinha-cpf-row" class="hidden">CPF: <span id="notinha-cpf"></span></p>
                </div>

                <div class="py-4 border-b border-dashed border-slate-300 font-mono text-xs space-y-3">
                    <div class="flex justify-between font-bold text-slate-700 border-b border-slate-200 pb-1 text-[11px]">
                        <span class="w-1/2">ITEM</span>
                        <span class="w-1/6 text-center">QTD</span>
                        <span class="w-1/6 text-right">VL.UN</span>
                        <span class="w-1/6 text-right">TOTAL</span>
                    </div>
                    <div id="notinha-itens" class="space-y-2 text-slate-600">
                        </div>
                </div>

                <div class="pt-4 font-mono text-xs space-y-1.5">
                    <div class="flex justify-between items-baseline font-bold text-base text-slate-900 mt-2 pt-2 border-t border-slate-200">
                        <span>TOTAL R$:</span>
                        <span id="notinha-total" class="text-lg font-black">R$ 0,00</span>
                    </div>
                </div>

                <div class="text-center pt-6 text-[10px] text-slate-400 font-mono uppercase tracking-widest">
                    Obrigado pela preferência!
                </div>
            </div>

            <div class="flex gap-4">
                <button onclick="window.print()" class="flex-1 py-2.5 bg-slate-800 text-white rounded-xl font-medium text-center hover:bg-slate-900 shadow-sm transition-colors flex items-center justify-center gap-2">
                    🖨️ Imprimir
                </button>
                <button onclick="novaCompra()" class="flex-1 py-2.5 bg-teal-600 text-white rounded-xl font-bold text-center hover:bg-teal-700 shadow-sm transition-colors">
                    Nova Compra 🛒
                </button>
            </div>
        </section>

    </main>

    <div id="toast" class="fixed bottom-6 left-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 translate-y-24 opacity-0 transition-all duration-300 z-50">
        <span id="toast-message">Mensagem</span>
    </div>

    <script src="../js/pdv.js"></script>
</body>
</html>
