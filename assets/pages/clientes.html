<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado+ | Gerenciador de Clientes</title>
    <link rel="icon" type="image/png" href="../imgs/icon-mercado.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="../css/clientes.css">
</head>

<body>
<!-- HEADER -->
<div id="app" class="wrapper">
    <header class="main-header sticky top-0 z-50 shadow-md">
        <div class="container header-content">
            <a href="../../index.html" class="logo-area">
                <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                </div>
                <img src="../imgs/logo-claro.png" alt="Logo Mercado+">
            </a>

            <a href="../../index.html" class="back-link">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Voltar
            </a>
        </div>
    </header>

    <main class="container main-content">
        <div class="page-header">
            <h1>Gerenciador de Clientes</h1>
        </div>

        <!-- CAIXA DE BUSCA CLIENTE -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar clientes...">
            </div>
            <!-- BOTÃO DE CADASTRO DE CLIENTE -->
            <button id="btn-add-product" class="btn-primary">+ Novo Cliente</button>
        </div>

        <!-- LISTAGEM DE CLIENTES -->
        <div class="table-container">
            <table class="w-full border-collapse">
                <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                <tr>
                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase">Cód.</th>
<th class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase">Nome</th>
                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase">CPF
                    </th>
                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase">E-mail</th>
                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase">Telefone</th>
                    <th class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase">Status</th>
                    <th class="px-6 py-4 text-center text-xs font-semibold text-slate-600 uppercase">Ações</th>
                </tr>
                </thead>
                <tbody id="products-table-body" class="divide-y divide-slate-100">
                </tbody>
            </table>
            <div id="empty-state" class="empty-msg hidden">Nenhum cliente encontrado.</div>
        </div>
        <div id="pagination-container" class="pagination-wrapper"></div>
    </main>
</div>

<!-- MODAL DE CADASTRO DE CLIENTE -->
<div id="product-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-title">Novo Cliente</h2>
            <button onclick="closeModal()" class="close-btn">&times;</button>
        </div>
        <form id="product-form" class="modal-body">
            <input type="hidden" id="edit-id">
            <div class="form-grid">
              <div class="form-group">
                    <label>Nome<span class="text-red-500">*</span></label>
                    <input type="text" id="nome" placeholder="Nome" required>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF<span class="text-red-500">*</span></label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required>
                </div>
                <div class="form-group">
                    <label>E-mail<span class="text-red-500">*</span></label>
                    <input type="email" id="email" placeholder="email@email.com" required>
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" id="telefone" placeholder="(00) 00000-0000">
                </div>
                <div class="form-group">
                    <label>Data de Nascimento</label>
                    <input type="date" id="data-nascimento">
                </div>                
                <div class="form-group">
                    <label>Status</label>
                    <select id="input-status" required>
                        <option value="Ativo">Ativo</option>
                        <option value="Inativo">Inativo</option>
                    </select>
                </div>
            </div>

            <!-- BOTÕES CANCELAR E SALVAR DO MODAL -->
            <div class="form-actions">
                <button type="button" onclick="closeModal()" class="btn-outline">Cancelar</button>
                <button type="submit" class="btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL DELETAR CLIENTE -->
<div id="delete-modal" class="modal">
    <div class="modal-content" style="max-width: 400px; text-align: center; padding: 2rem;">
        <h3>Excluir Cliente?</h3>
        <p>Esta ação não poderá ser desfeita.</p>
        <div class="form-actions">
            <button onclick="closeDeleteModal()" class="btn-outline">Cancelar</button>
            <button id="confirm-delete-btn" class="btn-primary-delete">Sim, excluir</button>
        </div>
    </div>
</div>

<div id="toast" class="toast">
    <span id="toast-message">Mensagem</span>
    <button onclick="closeToast()" class="toast-close">&times;</button>
</div>

    <script src="../js/clientes.js"></script>
</body>

</html>
